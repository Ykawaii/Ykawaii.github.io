<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon de jeu</title>
  <link rel="icon" href="../images/icon.png">
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --line: #2a2f3d; --text: #e8eaf0;
      --muted: #8a90a2; --accent: #7c5cff; --ok: #2ecc71; --warn: #f1c40f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); font-size: 15px;
    }
    button {
      padding: 10px 16px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .row > * { flex: 1 1 200px; }
    .row > button { flex: 0 0 auto; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .code { font-family: ui-monospace, monospace; font-size: 22px; letter-spacing: 3px; color: var(--accent); }
    ul.players { list-style: none; padding: 0; margin: 0; }
    ul.players li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
    .tag.ready { background: rgba(46, 204, 113, .15); color: var(--ok); }
    .tag.host { background: rgba(124, 92, 255, .15); color: var(--accent); }
    #messages { height: 280px; overflow-y: auto; padding-right: 4px; margin-bottom: 12px; }
    .msg { margin: 6px 0; word-wrap: break-word; }
    .msg b { color: var(--accent); }
    .msg.sys { color: var(--muted); font-style: italic; font-size: 14px; }
    #status { font-size: 14px; color: var(--warn); min-height: 20px; }
    .link { word-break: break-all; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Salon de jeu</h1>
  <p class="sub">Crée une partie, envoie le lien à tes amis, et lancez le jeu tous ensemble.</p>

  <!-- Accueil -->
  <div id="home" class="card">
    <div class="row" style="margin-bottom:16px">
      <div>
        <label for="name">Ton pseudo</label>
        <input id="name" maxlength="20" placeholder="ex : Ykawaii">
      </div>
    </div>
    <div class="row" style="margin-bottom:16px">
      <div>
        <label for="gameUrl">Lien du jeu</label>
        <input id="gameUrl" value="https://vel.gg/bo1z">
      </div>
      <button id="createBtn">Créer un salon</button>
    </div>
    <div class="row">
      <div>
        <label for="joinCode">Code du salon</label>
        <input id="joinCode" maxlength="6" placeholder="ex : K7P2QX" style="text-transform:uppercase">
      </div>
      <button id="joinBtn" class="ghost">Rejoindre</button>
    </div>
    <p id="status"></p>
  </div>

  <!-- Salon -->
  <div id="room" class="hidden">
    <div class="card">
      <div class="row">
        <div>
          <label>Code du salon</label>
          <div class="code" id="roomCode"></div>
          <div class="link" id="inviteLink"></div>
        </div>
        <button id="copyBtn" class="ghost">Copier le lien d'invitation</button>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <label>Joueurs (<span id="count">0</span>)</label>
        <ul class="players" id="players"></ul>
        <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap">
          <button id="readyBtn" class="ghost">Je suis prêt</button>
          <button id="launchBtn" class="hidden">Lancer le jeu</button>
        </div>
        <p class="link" style="margin-top:12px">Jeu : <a id="gameLink" target="_blank" rel="noopener" style="color:var(--accent)"></a></p>
      </div>
      <div class="card">
        <label>Chat</label>
        <div id="messages"></div>
        <form id="chatForm" class="row">
          <input id="chatInput" maxlength="300" placeholder="Écris un message…" autocomplete="off">
          <button type="submit">Envoyer</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Réseau pair-à-pair (WebRTC via PeerJS) : l'hôte du salon relaie l'état et les messages aux autres joueurs.
const PREFIX = 'ykawaii-salon-';
const $ = (id) => document.getElementById(id);

let peer = null;
let isHost = false;
let hostConn = null;            // côté invité : connexion vers l'hôte
const conns = new Map();        // côté hôte : peerId -> connexion
let state = { players: {}, gameUrl: '' }; // players: id -> { name, ready, host }
let myId = null;

function setStatus(text) { $('status').textContent = text; }
function myName() { return $('name').value.trim() || 'Joueur'; }

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function addMessage(from, text) {
  const div = document.createElement('div');
  if (from === null) {
    div.className = 'msg sys';
    div.textContent = text;
  } else {
    div.className = 'msg';
    const b = document.createElement('b');
    b.textContent = from + ' : ';
    div.append(b, document.createTextNode(text));
  }
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function render() {
  const ul = $('players');
  ul.innerHTML = '';
  const list = Object.entries(state.players);
  $('count').textContent = list.length;
  for (const [id, p] of list) {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.textContent = p.name + (id === myId ? ' (toi)' : '');
    const tag = document.createElement('span');
    tag.className = 'tag' + (p.host ? ' host' : p.ready ? ' ready' : '');
    tag.textContent = p.host ? 'hôte' : p.ready ? 'prêt' : 'en attente';
    li.append(name, tag);
    ul.appendChild(li);
  }
  const me = state.players[myId];
  $('readyBtn').textContent = me && me.ready ? 'Pas prêt' : 'Je suis prêt';
  $('readyBtn').classList.toggle('hidden', isHost);
  $('launchBtn').classList.toggle('hidden', !isHost);
  $('gameLink').href = state.gameUrl;
  $('gameLink').textContent = state.gameUrl;
}

function enterRoom(code) {
  $('home').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('roomCode').textContent = code;
  const link = location.origin + location.pathname + '#' + code;
  $('inviteLink').textContent = link;
  $('copyBtn').onclick = () => {
    navigator.clipboard.writeText(link).then(() => { $('copyBtn').textContent = 'Lien copié !'; });
  };
  render();
}

function launchGame(url) {
  addMessage(null, 'La partie commence ! Ouverture du jeu…');
  const w = window.open(url, '_blank');
  if (!w) addMessage(null, 'Ton navigateur a bloqué la fenêtre : clique sur le lien du jeu ci-contre.');
}

// ---------- Hôte ----------
function broadcast(msg) {
  for (const c of conns.values()) if (c.open) c.send(msg);
}
function syncState() { broadcast({ type: 'state', state }); render(); }

function handleFromGuest(conn, msg) {
  const p = state.players[conn.peer];
  if (msg.type === 'hello') {
    state.players[conn.peer] = { name: String(msg.name).slice(0, 20), ready: false, host: false };
    broadcast({ type: 'chat', from: null, text: state.players[conn.peer].name + ' a rejoint le salon.' });
    addMessage(null, state.players[conn.peer].name + ' a rejoint le salon.');
    syncState();
  } else if (!p) {
    return;
  } else if (msg.type === 'ready') {
    p.ready = !!msg.ready;
    syncState();
  } else if (msg.type === 'chat') {
    const text = String(msg.text).slice(0, 300);
    broadcast({ type: 'chat', from: p.name, text });
    addMessage(p.name, text);
  }
}

function createRoom() {
  const code = randomCode();
  isHost = true;
  setStatus('Création du salon…');
  peer = new Peer(PREFIX + code);
  peer.on('open', (id) => {
    myId = id;
    state = { players: { [id]: { name: myName(), ready: true, host: true } }, gameUrl: $('gameUrl').value.trim() };
    enterRoom(code);
    addMessage(null, 'Salon créé. Partage le lien ou le code avec tes amis.');
  });
  peer.on('connection', (conn) => {
    conns.set(conn.peer, conn);
    conn.on('data', (msg) => handleFromGuest(conn, msg));
    conn.on('close', () => {
      const p = state.players[conn.peer];
      conns.delete(conn.peer);
      delete state.players[conn.peer];
      if (p) {
        broadcast({ type: 'chat', from: null, text: p.name + ' a quitté le salon.' });
        addMessage(null, p.name + ' a quitté le salon.');
      }
      syncState();
    });
  });
  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); return; }
    setStatus('Erreur réseau : ' + err.type);
  });
}

// ---------- Invité ----------
function joinRoom(code) {
  code = code.trim().toUpperCase();
  if (!code) { setStatus('Entre un code de salon.'); return; }
  setStatus('Connexion au salon ' + code + '…');
  peer = new Peer();
  peer.on('open', (id) => {
    myId = id;
    hostConn = peer.connect(PREFIX + code, { reliable: true });
    hostConn.on('open', () => {
      hostConn.send({ type: 'hello', name: myName() });
      enterRoom(code);
    });
    hostConn.on('data', (msg) => {
      if (msg.type === 'state') { state = msg.state; render(); }
      else if (msg.type === 'chat') addMessage(msg.from, msg.text);
      else if (msg.type === 'launch') launchGame(msg.url);
    });
    hostConn.on('close', () => addMessage(null, "L'hôte a fermé le salon."));
  });
  peer.on('error', (err) => {
    setStatus(err.type === 'peer-unavailable' ? 'Salon introuvable. Vérifie le code.' : 'Erreur réseau : ' + err.type);
  });
}

// ---------- Interface ----------
$('createBtn').onclick = createRoom;
$('joinBtn').onclick = () => joinRoom($('joinCode').value);

$('readyBtn').onclick = () => {
  const me = state.players[myId];
  if (hostConn && me) hostConn.send({ type: 'ready', ready: !me.ready });
};

$('launchBtn').onclick = () => {
  const notReady = Object.values(state.players).filter((p) => !p.ready);
  if (notReady.length && !confirm(notReady.length + ' joueur(s) pas encore prêt(s). Lancer quand même ?')) return;
  broadcast({ type: 'launch', url: state.gameUrl });
  launchGame(state.gameUrl);
};

$('chatForm').onsubmit = (e) => {
  e.preventDefault();
  const text = $('chatInput').value.trim();
  if (!text) return;
  $('chatInput').value = '';
  if (isHost) {
    broadcast({ type: 'chat', from: myName(), text });
    addMessage(myName(), text);
  } else if (hostConn) {
    hostConn.send({ type: 'chat', text });
  }
};

// Pseudo mémorisé + lien d'invitation (#CODE)
try { $('name').value = localStorage.getItem('salon-name') || ''; } catch (e) {}
$('name').oninput = () => { try { localStorage.setItem('salon-name', $('name').value); } catch (e) {} };
if (location.hash.length > 1) {
  $('joinCode').value = location.hash.slice(1).toUpperCase();
  setStatus('Entre ton pseudo puis clique sur « Rejoindre ».');
}
</script>
</body>
</html>
